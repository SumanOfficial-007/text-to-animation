<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate 3D Particle Text Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
            color: white;
            /* No background here, fully handled by Three.js to prevent whitesmoke bug */
            background-color: transparent; 
        }
        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            background: transparent;
        }
        #ui-panel {
            position: absolute;
            top: 1.5rem;
            left: 1.5rem;
            z-index: 10;
            width: 340px;
            max-width: calc(100vw - 3rem);
            max-height: calc(100vh - 3rem);
            overflow-y: auto;
        }
        
        /* Hidden canvas for pixel extraction */
        #hidden-canvas {
            display: none;
        }

        /* Custom Scrollbar for UI panel */
        #ui-panel::-webkit-scrollbar {
            width: 6px;
        }
        #ui-panel::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 4px;
        }
        #ui-panel::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
        }

        /* Custom slider styling */
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 16px;
            width: 16px;
            border-radius: 50%;
            background: #60a5fa;
            cursor: pointer;
            margin-top: -6px;
            box-shadow: 0 0 10px rgba(96, 165, 250, 0.5);
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 2px;
        }
        
        /* Recording indicator animation */
        @keyframes pulse-red {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
        .recording {
            animation: pulse-red 1.5s infinite;
            background-color: #ef4444 !important;
            border-color: #ef4444 !important;
        }
    </style>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>

    <div id="canvas-container"></div>
    <canvas id="hidden-canvas" width="800" height="400"></canvas>

    <div id="ui-panel" class="bg-black/40 backdrop-blur-2xl border border-white/10 p-6 rounded-2xl shadow-[0_8px_32px_0_rgba(0,0,0,0.5)] transition-all">
        <h1 class="text-2xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-purple-500 mb-6 flex items-center gap-2">
            ✨ Pro Particles
        </h1>

        <div class="space-y-5">
            <!-- Text Input -->
            <div>
                <label class="block text-xs font-medium text-gray-400 uppercase tracking-wider mb-2">Display Text</label>
                <input type="text" id="text-input" value="STUDIO" 
                       class="w-full bg-white/5 border border-white/10 rounded-lg px-4 py-2 text-white focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all placeholder-gray-500 font-bold tracking-widest">
            </div>

            <!-- Font Selector -->
            <div>
                <label class="block text-xs font-medium text-gray-400 uppercase tracking-wider mb-2">Font Style</label>
                <select id="font-select" class="w-full bg-white/5 border border-white/10 rounded-lg px-4 py-2 text-white focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all cursor-pointer [&>option]:bg-gray-900">
                    <option value="Arial, sans-serif">Arial</option>
                    <option value="'Impact', sans-serif">Impact</option>
                    <option value="'Courier New', monospace">Courier New</option>
                    <option value="'Times New Roman', serif">Times New Roman</option>
                    <option value="'Comic Sans MS', cursive">Comic Sans</option>
                </select>
            </div>

            <!-- Colors -->
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-medium text-gray-400 uppercase tracking-wider mb-2">Text Color</label>
                    <div class="flex items-center gap-2">
                        <div class="relative w-8 h-8 rounded-full overflow-hidden border border-white/20">
                            <input type="color" id="text-color" value="#60a5fa" class="absolute -top-2 -left-2 w-12 h-12 cursor-pointer">
                        </div>
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-400 uppercase tracking-wider mb-2">Background</label>
                    <div class="flex items-center gap-2">
                        <div class="relative w-8 h-8 rounded-full overflow-hidden border border-white/20">
                            <input type="color" id="bg-color" value="#0a0a16" class="absolute -top-2 -left-2 w-12 h-12 cursor-pointer">
                        </div>
                    </div>
                </div>
            </div>

            <!-- Sliders -->
            <div>
                <label class="flex justify-between text-xs font-medium text-gray-400 uppercase tracking-wider mb-2">
                    <span>Particle Size</span>
                    <span id="size-val">1.5</span>
                </label>
                <input type="range" id="size-slider" min="0.5" max="5.0" step="0.1" value="1.5">
            </div>

            <div>
                <label class="flex justify-between text-xs font-medium text-gray-400 uppercase tracking-wider mb-2">
                    <span>Repel Radius</span>
                    <span id="repel-val">30</span>
                </label>
                <input type="range" id="repel-slider" min="0" max="100" step="1" value="30">
            </div>
            
            <!-- Shape & Toggles -->
            <div class="flex items-center justify-between pt-2">
                <div>
                    <label class="block text-xs font-medium text-gray-400 uppercase tracking-wider mb-2">Shape</label>
                    <select id="shape-select" class="bg-white/5 border border-white/10 rounded-lg px-2 py-1 text-sm text-white focus:outline-none cursor-pointer [&>option]:bg-gray-900">
                        <option value="circle">Circle</option>
                        <option value="square">Square</option>
                    </select>
                </div>
                
                <div class="flex flex-col items-end">
                    <label class="block text-xs font-medium text-gray-400 uppercase tracking-wider mb-2">Auto-Rotate</label>
                    <label class="relative inline-flex items-center cursor-pointer">
                        <input type="checkbox" id="auto-rotate" class="sr-only peer" checked>
                        <div class="w-9 h-5 bg-gray-600 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-blue-500"></div>
                    </label>
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="pt-4 space-y-3">
                <button id="generate-btn" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-medium py-2.5 rounded-lg transition-colors shadow-lg">
                    Generate Text
                </button>
                
                <button id="scatter-btn" class="w-full bg-white/10 hover:bg-white/20 border border-white/20 text-white font-medium py-2.5 rounded-lg transition-colors">
                    Scatter Particles
                </button>

                <button id="record-btn" class="w-full flex items-center justify-center gap-2 bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white font-medium py-2.5 rounded-lg transition-all shadow-lg">
                    <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z" clip-rule="evenodd"></path></svg>
                    <span id="record-text">Start Recording</span>
                </button>
            </div>
        </div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // --- Core Variables ---
        const container = document.getElementById('canvas-container');
        let scene, camera, renderer, controls;
        let particleSystem, particleGeometry, particleMaterial;
        let targetPositions = [];
        let originalPositions = [];
        const clock = new THREE.Clock();

        // UI Elements
        const textInput = document.getElementById('text-input');
        const fontSelect = document.getElementById('font-select');
        const textColorInput = document.getElementById('text-color');
        const bgColorInput = document.getElementById('bg-color');
        const sizeSlider = document.getElementById('size-slider');
        const repelSlider = document.getElementById('repel-slider');
        const shapeSelect = document.getElementById('shape-select');
        const autoRotateToggle = document.getElementById('auto-rotate');
        
        // Settings
        let settings = {
            text: textInput.value,
            font: fontSelect.value,
            textColor: textColorInput.value,
            bgColor: bgColorInput.value,
            particleSize: parseFloat(sizeSlider.value),
            repelRadius: parseFloat(repelSlider.value),
            shape: shapeSelect.value,
            autoRotate: autoRotateToggle.checked,
            density: 4 // Sample 1 particle every N pixels
        };

        // --- Textures ---
        function createCircleTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 64;
            canvas.height = 64;
            const ctx = canvas.getContext('2d');
            ctx.beginPath();
            ctx.arc(32, 32, 28, 0, Math.PI * 2);
            ctx.fillStyle = '#ffffff';
            ctx.fill();
            const texture = new THREE.CanvasTexture(canvas);
            return texture;
        }
        const circleTexture = createCircleTexture();

        // --- Initialization ---
        function init() {
            scene = new THREE.Scene();

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 0, 150);

            // CRITICAL: preserveDrawingBuffer must be true for MediaRecorder to capture properly
            // alpha: false ensures the clearColor is solidly rendered, fixing the whitesmoke bug
            renderer = new THREE.WebGLRenderer({ 
                antialias: true, 
                preserveDrawingBuffer: true,
                alpha: false 
            });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.setClearColor(new THREE.Color(settings.bgColor), 1);
            container.appendChild(renderer.domElement);

            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.maxDistance = 300;
            controls.minDistance = 20;

            window.addEventListener('resize', onWindowResize);
            
            // Mouse Interaction Setup
            window.addEventListener('mousemove', onMouseMove);
            window.addEventListener('touchmove', onTouchMove, {passive: true});

            generateParticles();
            animate();
        }

        // --- 2D Canvas to 3D Particles Logic ---
        function generateParticles() {
            // 1. Draw text on hidden canvas
            const canvas = document.getElementById('hidden-canvas');
            const ctx = canvas.getContext('2d', { willReadFrequently: true });
            const width = canvas.width;
            const height = canvas.height;

            ctx.clearRect(0, 0, width, height);
            
            // Calculate dynamic font size based on text length to fit canvas
            let fontSize = 120;
            if(settings.text.length > 6) {
                fontSize = Math.max(40, 120 - (settings.text.length - 6) * 10);
            }

            ctx.font = `bold ${fontSize}px ${settings.font}`;
            ctx.fillStyle = 'white';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(settings.text, width / 2, height / 2);

            // 2. Extract Pixel Data
            const imgData = ctx.getImageData(0, 0, width, height).data;
            const positions = [];

            // 3. Convert solid pixels to 3D coordinates
            for (let y = 0; y < height; y += settings.density) {
                for (let x = 0; x < width; x += settings.density) {
                    const index = (y * width + x) * 4;
                    const alpha = imgData[index + 3];

                    // If pixel is not fully transparent
                    if (alpha > 128) {
                        // Map 2D coordinates to 3D space, centered
                        const pX = (x - width / 2) * 0.3;
                        const pY = -(y - height / 2) * 0.3; // Invert Y
                        
                        // Add slight random depth for 3D effect
                        const pZ = (Math.random() - 0.5) * 4;

                        positions.push(pX, pY, pZ);
                    }
                }
            }

            // 4. Update or Create Particle System
            if (particleSystem) {
                scene.remove(particleSystem);
                particleGeometry.dispose();
                particleMaterial.dispose();
            }

            if (positions.length === 0) return; // Prevent errors on empty text

            particleGeometry = new THREE.BufferGeometry();
            
            // Store original target positions
            targetPositions = new Float32Array(positions);
            originalPositions = new Float32Array(positions); // Keeps track of un-repelled state
            
            // Initial positions scattered around
            const startPositions = new Float32Array(positions.length);
            for(let i=0; i<positions.length; i++) {
                startPositions[i] = positions[i] + (Math.random() - 0.5) * 200;
            }

            particleGeometry.setAttribute('position', new THREE.BufferAttribute(startPositions, 3));
            particleGeometry.setAttribute('target', new THREE.BufferAttribute(targetPositions, 3));

            particleMaterial = new THREE.PointsMaterial({
                color: new THREE.Color(settings.textColor),
                size: settings.particleSize,
                transparent: true,
                opacity: 0.9,
                depthWrite: false,
                blending: THREE.AdditiveBlending,
                map: settings.shape === 'circle' ? circleTexture : null,
                alphaTest: 0.1 // Discard fully transparent edge pixels of circle
            });

            particleSystem = new THREE.Points(particleGeometry, particleMaterial);
            scene.add(particleSystem);
        }

        // --- Mouse Repulsion Physics ---
        const mouse = new THREE.Vector2();
        const raycaster = new THREE.Raycaster();
        const plane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);
        const planeIntersect = new THREE.Vector3();

        function updateMouseIntersections(clientX, clientY) {
            mouse.x = (clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(clientY / window.innerHeight) * 2 + 1;
            
            raycaster.setFromCamera(mouse, camera);
            raycaster.ray.intersectPlane(plane, planeIntersect);
        }

        function onMouseMove(event) {
            updateMouseIntersections(event.clientX, event.clientY);
        }
        function onTouchMove(event) {
            if(event.touches.length > 0) {
                updateMouseIntersections(event.touches[0].clientX, event.touches[0].clientY);
            }
        }

        function scatter() {
            if(!particleSystem) return;
            const positions = particleSystem.geometry.attributes.position.array;
            for (let i = 0; i < positions.length; i+=3) {
                positions[i] += (Math.random() - 0.5) * 150;
                positions[i+1] += (Math.random() - 0.5) * 150;
                positions[i+2] += (Math.random() - 0.5) * 150;
            }
            particleSystem.geometry.attributes.position.needsUpdate = true;
        }

        // --- UI Event Listeners ---
        document.getElementById('generate-btn').addEventListener('click', () => {
            settings.text = textInput.value || " ";
            settings.font = fontSelect.value;
            generateParticles();
        });

        textColorInput.addEventListener('input', (e) => {
            settings.textColor = e.target.value;
            if(particleSystem) particleSystem.material.color.set(settings.textColor);
        });

        bgColorInput.addEventListener('input', (e) => {
            settings.bgColor = e.target.value;
            // Update the renderer's clear color immediately
            renderer.setClearColor(new THREE.Color(settings.bgColor), 1);
        });

        sizeSlider.addEventListener('input', (e) => {
            settings.particleSize = parseFloat(e.target.value);
            document.getElementById('size-val').innerText = settings.particleSize.toFixed(1);
            if(particleSystem) particleSystem.material.size = settings.particleSize;
        });

        repelSlider.addEventListener('input', (e) => {
            settings.repelRadius = parseFloat(e.target.value);
            document.getElementById('repel-val').innerText = settings.repelRadius;
        });

        shapeSelect.addEventListener('change', (e) => {
            settings.shape = e.target.value;
            if(particleSystem) {
                particleSystem.material.map = settings.shape === 'circle' ? circleTexture : null;
                particleSystem.material.needsUpdate = true;
            }
        });

        autoRotateToggle.addEventListener('change', (e) => {
            settings.autoRotate = e.target.checked;
        });

        document.getElementById('scatter-btn').addEventListener('click', scatter);

        // --- Video Recording Logic (MediaRecorder API) ---
        let mediaRecorder;
        let recordedChunks = [];
        let isRecording = false;
        const recordBtn = document.getElementById('record-btn');
        const recordText = document.getElementById('record-text');

        recordBtn.addEventListener('click', () => {
            if (!isRecording) {
                startRecording();
            } else {
                stopRecording();
            }
        });

        function startRecording() {
            recordedChunks = [];
            // Capture stream at 30 fps
            const stream = renderer.domElement.captureStream(30);
            
            try {
                // Prefer modern webm codecs
                let options = { mimeType: 'video/webm; codecs=vp9' };
                if (!MediaRecorder.isTypeSupported(options.mimeType)) {
                    options = { mimeType: 'video/webm; codecs=vp8' };
                    if (!MediaRecorder.isTypeSupported(options.mimeType)) {
                        options = { mimeType: 'video/webm' };
                    }
                }
                
                mediaRecorder = new MediaRecorder(stream, options);
            } catch (e) {
                alert("MediaRecorder is not supported in this browser.");
                return;
            }

            mediaRecorder.ondataavailable = (event) => {
                if (event.data.size > 0) {
                    recordedChunks.push(event.data);
                }
            };

            mediaRecorder.onstop = () => {
                const blob = new Blob(recordedChunks, { type: 'video/webm' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.style.display = 'none';
                a.href = url;
                a.download = `particle-text-${Date.now()}.webm`;
                document.body.appendChild(a);
                a.click();
                setTimeout(() => {
                    document.body.removeChild(a);
                    window.URL.revokeObjectURL(url);
                }, 100);
            };

            mediaRecorder.start();
            isRecording = true;
            recordBtn.classList.add('recording');
            recordText.innerText = "Stop & Save Video";
        }

        function stopRecording() {
            if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                mediaRecorder.stop();
            }
            isRecording = false;
            recordBtn.classList.remove('recording');
            recordText.innerText = "Start Recording";
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // --- Animation Loop ---
        function animate() {
            requestAnimationFrame(animate);
            const time = clock.getElapsedTime();

            if (particleSystem) {
                const positions = particleSystem.geometry.attributes.position.array;
                
                for (let i = 0; i < positions.length; i += 3) {
                    // Base target position from text formation
                    let targetX = originalPositions[i];
                    let targetY = originalPositions[i+1];
                    let targetZ = originalPositions[i+2];

                    // Apply Repulsion
                    if (settings.repelRadius > 0) {
                        const dx = positions[i] - planeIntersect.x;
                        const dy = positions[i+1] - planeIntersect.y;
                        const distSq = dx*dx + dy*dy;
                        const repelSq = settings.repelRadius * settings.repelRadius;

                        if (distSq < repelSq) {
                            const force = (repelSq - distSq) / repelSq; // 0 to 1
                            targetX += dx * force;
                            targetY += dy * force;
                            targetZ += 20 * force; // Push forward slightly
                        }
                    }

                    // Add slight sine wave float for life-like movement
                    targetY += Math.sin(time * 2 + i) * 0.2;

                    // Lerp towards target
                    positions[i] += (targetX - positions[i]) * 0.1;
                    positions[i+1] += (targetY - positions[i+1]) * 0.1;
                    positions[i+2] += (targetZ - positions[i+2]) * 0.1;
                }
                
                particleSystem.geometry.attributes.position.needsUpdate = true;
                
                if (settings.autoRotate) {
                    // Rotate the whole container slightly
                    particleSystem.rotation.y = Math.sin(time * 0.5) * 0.2;
                    particleSystem.rotation.x = Math.sin(time * 0.3) * 0.1;
                } else {
                    // Reset rotation gracefully
                    particleSystem.rotation.y += (0 - particleSystem.rotation.y) * 0.05;
                    particleSystem.rotation.x += (0 - particleSystem.rotation.x) * 0.05;
                }
            }

            controls.update();
            renderer.render(scene, camera);
        }

        // Start everything
        init();
    </script>
</body>
</html>
