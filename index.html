<!DOCTYPE html>
<html lang="en" class="antialiased">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pro Particle Text Studio</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        dark: '#0f0f15',
                        panel: 'rgba(20, 20, 30, 0.75)',
                    }
                }
            }
        }
    </script>

    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #050505; /* Fallback */
            touch-action: none; /* Prevent scroll on mobile */
        }
        
        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }

        /* Glassmorphism Panel */
        .glass-panel {
            background: rgba(15, 15, 20, 0.65);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.8);
        }

        /* Range Slider */
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
            height: 4px;
            border-radius: 2px;
            background: rgba(255, 255, 255, 0.1);
            outline: none;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 14px;
            width: 14px;
            border-radius: 50%;
            background: #3b82f6;
            cursor: pointer;
            margin-top: -5px;
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.5);
            transition: transform 0.1s;
        }
        input[type=range]::-webkit-slider-thumb:hover {
            transform: scale(1.3);
        }

        /* Color Picker */
        input[type="color"] {
            -webkit-appearance: none;
            border: none;
            padding: 0;
            background: transparent;
        }
        input[type="color"]::-webkit-color-swatch-wrapper {
            padding: 0;
        }
        input[type="color"]::-webkit-color-swatch {
            border: none;
            border-radius: 6px;
        }

        /* Custom Scrollbar */
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(255,255,255,0.02);
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.1);
            border-radius: 4px;
        }

        /* Responsive Panel Transitions */
        #ui-panel {
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.4s ease;
        }
        
        /* Desktop */
        @media (min-width: 768px) {
            #ui-panel.hidden-state {
                transform: translateX(-120%);
                opacity: 0;
                pointer-events: none;
            }
        }
        
        /* Mobile */
        @media (max-width: 767px) {
            #ui-panel.hidden-state {
                transform: translateY(110%);
                opacity: 0;
                pointer-events: none;
            }
        }
    </style>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body class="text-white">

    <div id="canvas-container"></div>

    <!-- Toggle UI Button -->
    <button id="toggle-ui" class="fixed top-4 left-4 md:top-6 md:left-6 z-30 w-12 h-12 glass-panel rounded-full flex items-center justify-center hover:bg-white/10 transition-colors shadow-lg border border-white/10 group">
        <svg id="toggle-icon" class="w-5 h-5 text-gray-300 group-hover:text-white transition-transform duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
        </svg>
    </button>

    <!-- Control Panel -->
    <div id="ui-panel" class="fixed bottom-0 left-0 right-0 md:bottom-auto md:top-24 md:left-6 md:right-auto md:w-[340px] glass-panel rounded-t-3xl md:rounded-2xl z-20 flex flex-col max-h-[85vh] md:max-h-[calc(100vh-8rem)]">
        
        <div class="px-6 py-5 border-b border-white/5 flex items-center justify-between">
            <h1 class="text-lg font-black tracking-tight flex items-center gap-2 text-blue-400">
                <span class="text-xl">✨</span> Pro Particles
            </h1>
            <!-- Mobile pull indicator -->
            <div class="w-12 h-1 bg-white/20 rounded-full md:hidden absolute top-3 left-1/2 -translate-x-1/2"></div>
        </div>

        <div class="p-6 space-y-5 overflow-y-auto custom-scrollbar flex-1">
            
            <!-- Text Input -->
            <div class="space-y-1.5">
                <label class="text-[10px] font-bold text-gray-400 uppercase tracking-widest">Display Text</label>
                <input type="text" id="text-input" class="w-full bg-black/40 border border-white/10 rounded-lg px-3 py-2.5 text-sm text-white focus:outline-none focus:border-blue-500 transition-colors" value="suman">
            </div>

            <!-- Font Style -->
            <div class="space-y-1.5">
                <label class="text-[10px] font-bold text-gray-400 uppercase tracking-widest">Font Style</label>
                <select id="font-select" class="w-full bg-black/40 border border-white/10 rounded-lg px-3 py-2.5 text-sm text-white focus:outline-none focus:border-blue-500 transition-colors appearance-none cursor-pointer">
                    <option value="Arial">Arial</option>
                    <option value="Impact">Impact</option>
                    <option value="Inter">Inter</option>
                    <option value="Times New Roman">Times New Roman</option>
                </select>
            </div>

            <!-- Colors -->
            <div class="grid grid-cols-2 gap-4">
                <div class="space-y-1.5">
                    <label class="text-[10px] font-bold text-gray-400 uppercase tracking-widest">Text Color</label>
                    <div class="flex items-center gap-2 bg-black/40 p-1.5 rounded-lg border border-white/10">
                        <input type="color" id="text-color" value="#3b82f6" class="w-6 h-6 rounded cursor-pointer">
                        <span id="hex-text" class="text-[11px] font-mono text-gray-300">#3b82f6</span>
                    </div>
                </div>
                <div class="space-y-1.5">
                    <label class="text-[10px] font-bold text-gray-400 uppercase tracking-widest">Background</label>
                    <div class="flex items-center gap-2 bg-black/40 p-1.5 rounded-lg border border-white/10">
                        <input type="color" id="bg-color" value="#050508" class="w-6 h-6 rounded cursor-pointer">
                        <span id="hex-bg" class="text-[11px] font-mono text-gray-300">#050508</span>
                    </div>
                </div>
            </div>

            <!-- Sliders -->
            <div class="space-y-4 pt-2">
                <div>
                    <div class="flex justify-between mb-1">
                        <label class="text-[10px] font-bold text-gray-400 uppercase tracking-widest">Particle Size</label>
                        <span id="val-size" class="text-[10px] text-gray-300 font-mono">0.9</span>
                    </div>
                    <input type="range" id="size-slider" min="0.5" max="3.0" step="0.1" value="0.9">
                </div>
                
                <div>
                    <div class="flex justify-between mb-1">
                        <label class="text-[10px] font-bold text-gray-400 uppercase tracking-widest">Repel Radius</label>
                        <span id="val-radius" class="text-[10px] text-gray-300 font-mono">40</span>
                    </div>
                    <input type="range" id="radius-slider" min="10" max="100" step="1" value="40">
                </div>
            </div>

            <!-- Toggles -->
            <div class="flex items-center justify-between pt-2">
                <div class="space-y-1">
                    <label class="text-[10px] font-bold text-gray-400 uppercase tracking-widest block">Shape</label>
                    <select id="shape-select" class="bg-black/40 border border-white/10 rounded px-2 py-1 text-[11px] text-white focus:outline-none cursor-pointer">
                        <option value="circle">Circle</option>
                        <option value="square">Square</option>
                    </select>
                </div>
                
                <div class="flex flex-col items-end gap-1">
                    <label class="text-[10px] font-bold text-gray-400 uppercase tracking-widest">Auto-Rotate</label>
                    <label class="relative inline-flex items-center cursor-pointer">
                        <input type="checkbox" id="auto-rotate" class="sr-only peer">
                        <div class="w-8 h-4 bg-gray-600 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-3 after:w-3 after:transition-all peer-checked:bg-blue-500"></div>
                    </label>
                </div>
            </div>

            <!-- Actions -->
            <div class="pt-4 space-y-2">
                <button id="btn-generate" class="w-full py-2.5 bg-blue-600 hover:bg-blue-500 text-white text-sm rounded-lg font-bold transition-all shadow-[0_0_15px_rgba(37,99,235,0.4)] hover:shadow-[0_0_20px_rgba(37,99,235,0.6)]">
                    Generate Text
                </button>
                <button id="btn-scatter" class="w-full py-2.5 bg-white/5 border border-white/10 hover:bg-white/10 text-white text-sm rounded-lg font-semibold transition-all">
                    Scatter Particles
                </button>
                <button id="btn-record" class="w-full py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white text-sm rounded-lg font-bold transition-all flex items-center justify-center gap-2 group">
                    <div class="w-2.5 h-2.5 bg-white rounded-full group-hover:scale-110 transition-transform"></div>
                    <span id="record-text">Start Recording</span>
                </button>
            </div>
            
        </div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // Main WebGL Variables
        let scene, camera, renderer, controls;
        let particles, geometry, material;
        
        // HUD / Watermark Variables
        let hudScene, hudCamera, watermarkSprite;
        
        // Physics Data
        let originalPositions = [];
        let mouse = new THREE.Vector2(-9999, -9999);
        let raycaster = new THREE.Raycaster();
        let targetPlane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);
        let pointOfIntersection = new THREE.Vector3();
        let time = 0;
        
        // Recording state
        let mediaRecorder;
        let recordedChunks = [];
        let isRecording = false;

        // UI State Map
        const State = {
            text: "suman",
            font: "Arial",
            textColor: "#3b82f6",
            bgColor: "#050508",
            particleSize: 0.9,
            repelRadius: 40,
            shape: "circle",
            autoRotate: false,
            density: 5 // Spacing of particles. Higher = spread out grid
        };

        function init() {
            // Main Scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(State.bgColor);

            // Camera
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 1, 2000);
            camera.position.set(0, 0, 200);

            // Renderer setup (preserveDrawingBuffer is required for capturing the canvas stream)
            renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true, alpha: false });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.setClearColor(State.bgColor, 1);
            
            // Allow multiple scenes to be rendered on top of each other (HUD)
            renderer.autoClear = false; 
            
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            // Controls
            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;

            // Setup HUD Watermark
            initHUD();

            // Generate initial text
            createTextParticles();

            // Events
            window.addEventListener('resize', onWindowResize);
            window.addEventListener('mousemove', onMouseMove);
            window.addEventListener('touchmove', onTouchMove, { passive: true });
            
            setupUIBindings();
            
            animate();
        }

        // --- STREAMING_CHUNK: HUD Watermark Logic ---
        function initHUD() {
            hudScene = new THREE.Scene();
            hudCamera = new THREE.OrthographicCamera(
                -window.innerWidth / 2, window.innerWidth / 2,
                window.innerHeight / 2, -window.innerHeight / 2,
                0, 10
            );
            hudCamera.position.z = 5;

            // Create Canvas for Watermark Text
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 64;
            const ctx = canvas.getContext('2d');
            
            ctx.fillStyle = 'rgba(255, 255, 255, 0.4)'; // Semi-transparent white
            ctx.font = '14px Inter, sans-serif';
            ctx.textAlign = 'right';
            ctx.textBaseline = 'bottom';
            ctx.fillText('developed and designed by suman M.', canvas.width - 20, canvas.height - 20);

            const texture = new THREE.CanvasTexture(canvas);
            texture.minFilter = THREE.LinearFilter; // Ensure crisp text
            
            const spriteMaterial = new THREE.SpriteMaterial({ 
                map: texture, 
                transparent: true,
                depthTest: false,
                depthWrite: false
            });
            
            watermarkSprite = new THREE.Sprite(spriteMaterial);
            watermarkSprite.scale.set(canvas.width, canvas.height, 1);
            
            // Position at bottom right
            updateWatermarkPosition();
            
            hudScene.add(watermarkSprite);
        }

        function updateWatermarkPosition() {
            if (watermarkSprite) {
                // Pin to bottom right corner of the orthographic camera
                watermarkSprite.position.set(
                    (window.innerWidth / 2) - (watermarkSprite.scale.x / 2),
                    -(window.innerHeight / 2) + (watermarkSprite.scale.y / 2),
                    1
                );
            }
        }

        // --- STREAMING_CHUNK: Precise 2D Pixel to 3D Particle Generator ---
        function createTextParticles() {
            if (particles) {
                scene.remove(particles);
                geometry.dispose();
                material.dispose();
                originalPositions = [];
            }

            if (!State.text.trim()) return;

            // High res canvas for precise text measuring
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d', { willReadFrequently: true });
            
            const fontSize = 120; 
            const fontWeight = (State.font === 'Arial' || State.font === 'Impact') ? 'bold' : '900';
            ctx.font = `${fontWeight} ${fontSize}px "${State.font}", sans-serif`;
            
            // Dynamic Width calculation to fix squishing
            const metrics = ctx.measureText(State.text);
            const textWidth = Math.max(Math.ceil(metrics.width), 10);
            const textHeight = fontSize * 1.5;
            
            // Add padding
            canvas.width = textWidth + 80; 
            canvas.height = textHeight;

            // Re-apply font after resize!
            ctx.font = `${fontWeight} ${fontSize}px "${State.font}", sans-serif`;
            ctx.fillStyle = 'white';
            ctx.textBaseline = 'middle';
            ctx.textAlign = 'center';
            ctx.fillText(State.text, canvas.width / 2, canvas.height / 2);

            // Read Pixels
            const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
            const positions = [];
            const colors = [];
            const colorObj = new THREE.Color(State.textColor);

            // Center offsets for 3D translation
            const offsetX = canvas.width / 2;
            const offsetY = canvas.height / 2;

            // Scan grid
            for (let y = 0; y < canvas.height; y += State.density) {
                for (let x = 0; x < canvas.width; x += State.density) {
                    const index = (x + y * canvas.width) * 4;
                    const alpha = imgData[index + 3]; // get opacity
                    
                    if (alpha > 128) {
                        // Map to 3D space, shrinking scale to fit scene
                        const pX = (x - offsetX) * 0.4;
                        const pY = -(y - offsetY) * 0.4;
                        const pZ = (Math.random() - 0.5) * 1.5; // Tiny Z variation for thickness

                        positions.push(pX, pY, pZ);
                        originalPositions.push(new THREE.Vector3(pX, pY, pZ));
                        colors.push(colorObj.r, colorObj.g, colorObj.b);
                    }
                }
            }

            if (positions.length === 0) return;

            // Build Buffer Geometry
            geometry = new THREE.BufferGeometry();
            geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
            geometry.setAttribute('basePosition', new THREE.Float32BufferAttribute(positions, 3));

            // Material
            material = new THREE.PointsMaterial({
                size: State.particleSize,
                vertexColors: true,
                transparent: true,
                opacity: 0.85,
                depthWrite: false,
                blending: THREE.AdditiveBlending
            });

            // Make particles circular if selected
            if (State.shape === 'circle') {
                material.onBeforeCompile = (shader) => {
                    shader.fragmentShader = shader.fragmentShader.replace(
                        `gl_FragColor = vec4( diffuseColor.rgb * vColor, diffuseColor.a );`,
                        `
                        vec2 xy = gl_PointCoord.xy - vec2(0.5);
                        float ll = length(xy);
                        if(ll > 0.5) discard;
                        gl_FragColor = vec4( diffuseColor.rgb * vColor, diffuseColor.a * smoothstep(0.5, 0.4, ll) );
                        `
                    );
                };
            }

            particles = new THREE.Points(geometry, material);
            scene.add(particles);

            // Auto-Fit Camera
            const actualTextWidth = canvas.width * 0.4;
            const fov = camera.fov * (Math.PI / 180);
            let targetZ = Math.abs((actualTextWidth / 2) / Math.tan(fov / 2)) * 1.2;
            
            // Clamping zoom limits
            targetZ = Math.max(targetZ, 50); 
            targetZ = Math.min(targetZ, 350);
            
            camera.position.set(0, 0, targetZ);
            controls.target.set(0, 0, 0);
        }

        // --- STREAMING_CHUNK: Mouse Interactions & Particle Physics ---
        function onMouseMove(event) {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
        }

        function onTouchMove(event) {
            if (event.touches.length > 0) {
                mouse.x = (event.touches[0].clientX / window.innerWidth) * 2 - 1;
                mouse.y = -(event.touches[0].clientY / window.innerHeight) * 2 + 1;
            }
        }

        function updatePhysics() {
            if (!particles || !geometry) return;
            
            time += 0.05;

            // Find mouse in 3D world (Z=0 plane)
            raycaster.setFromCamera(mouse, camera);
            raycaster.ray.intersectPlane(targetPlane, pointOfIntersection);

            const positions = geometry.attributes.position.array;
            const basePositions = geometry.attributes.basePosition.array;
            let isHovering = mouse.x !== -9999 && mouse.y !== -9999;
            
            for (let i = 0; i < originalPositions.length; i++) {
                const idx = i * 3;
                
                let px = positions[idx];
                let py = positions[idx + 1];
                let pz = positions[idx + 2];

                const bx = basePositions[idx];
                const by = basePositions[idx + 1];
                const bz = basePositions[idx + 2];

                // Mouse Repel Logic
                let dx = isHovering ? pointOfIntersection.x - px : 1000;
                let dy = isHovering ? pointOfIntersection.y - py : 1000;
                let distSq = dx * dx + dy * dy;
                const radiusSq = State.repelRadius * State.repelRadius;

                if (distSq < radiusSq) {
                    const dist = Math.sqrt(distSq);
                    // Stronger repel closer to center
                    const force = (State.repelRadius - dist) / State.repelRadius; 
                    const angle = Math.atan2(dy, dx);
                    
                    px -= Math.cos(angle) * force * 1.5;
                    py -= Math.sin(angle) * force * 1.5;
                    pz += (Math.random() - 0.5) * force * 3;
                } else {
                    // Smooth return to base position (lerp)
                    px += (bx - px) * 0.15;
                    py += (by - py) * 0.15;
                    pz += (bz - pz) * 0.15;
                }

                // Sine wave breathing effect
                pz += Math.sin(time + bx * 0.05) * 0.02;

                positions[idx] = px;
                positions[idx + 1] = py;
                positions[idx + 2] = pz;
            }

            geometry.attributes.position.needsUpdate = true;
        }

        // --- STREAMING_CHUNK: Video Recording Pipeline ---
        function handleRecording() {
            const btn = document.getElementById('btn-record');
            const text = document.getElementById('record-text');
            const indicator = btn.querySelector('div');

            if (isRecording) {
                // Stop Recording
                mediaRecorder.stop();
                isRecording = false;
                
                text.innerText = "Start Recording";
                btn.classList.remove('bg-red-600', 'hover:bg-red-500');
                btn.classList.add('bg-emerald-600', 'hover:bg-emerald-500');
                indicator.classList.remove('animate-pulse', 'bg-red-200');
                indicator.classList.add('bg-white');
                
            } else {
                // Start Recording
                const stream = renderer.domElement.captureStream(60); // 60 FPS
                recordedChunks = [];
                
                let options = { mimeType: 'video/webm; codecs=vp9' };
                if (!MediaRecorder.isTypeSupported(options.mimeType)) {
                    options = { mimeType: 'video/webm' };
                }

                mediaRecorder = new MediaRecorder(stream, options);

                mediaRecorder.ondataavailable = (e) => {
                    if (e.data.size > 0) recordedChunks.push(e.data);
                };

                mediaRecorder.onstop = () => {
                    const blob = new Blob(recordedChunks, { type: 'video/webm' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.style.display = 'none';
                    a.href = url;
                    a.download = `Particle_Text_${Date.now()}.webm`;
                    document.body.appendChild(a);
                    a.click();
                    setTimeout(() => {
                        document.body.removeChild(a);
                        window.URL.revokeObjectURL(url);
                    }, 100);
                };

                mediaRecorder.start();
                isRecording = true;
                
                text.innerText = "Stop Recording";
                btn.classList.remove('bg-emerald-600', 'hover:bg-emerald-500');
                btn.classList.add('bg-red-600', 'hover:bg-red-500');
                indicator.classList.remove('bg-white');
                indicator.classList.add('animate-pulse', 'bg-red-200');
            }
        }

        // --- STREAMING_CHUNK: UI Binding & Event Listeners ---
        function setupUIBindings() {
            // Reusable update color helper
            const updateColors = () => {
                if (!particles) return;
                const colorObj = new THREE.Color(State.textColor);
                const colors = geometry.attributes.color.array;
                for (let i = 0; i < colors.length; i += 3) {
                    colors[i] = colorObj.r;
                    colors[i+1] = colorObj.g;
                    colors[i+2] = colorObj.b;
                }
                geometry.attributes.color.needsUpdate = true;
            };

            // Inputs
            document.getElementById('text-input').addEventListener('input', (e) => {
                State.text = e.target.value;
                // Live typing updates
                createTextParticles(); 
            });

            document.getElementById('font-select').addEventListener('change', (e) => {
                State.font = e.target.value;
                createTextParticles();
            });

            document.getElementById('text-color').addEventListener('input', (e) => {
                State.textColor = e.target.value;
                document.getElementById('hex-text').innerText = e.target.value;
                updateColors();
            });

            document.getElementById('bg-color').addEventListener('input', (e) => {
                State.bgColor = e.target.value;
                document.getElementById('hex-bg').innerText = e.target.value;
                scene.background.set(State.bgColor);
                renderer.setClearColor(State.bgColor, 1);
            });

            document.getElementById('size-slider').addEventListener('input', (e) => {
                State.particleSize = parseFloat(e.target.value);
                document.getElementById('val-size').innerText = State.particleSize.toFixed(1);
                if (material) material.size = State.particleSize;
            });

            document.getElementById('radius-slider').addEventListener('input', (e) => {
                State.repelRadius = parseInt(e.target.value);
                document.getElementById('val-radius').innerText = State.repelRadius;
            });
            
            document.getElementById('shape-select').addEventListener('change', (e) => {
                State.shape = e.target.value;
                createTextParticles(); // Rebuild material shader
            });

            document.getElementById('auto-rotate').addEventListener('change', (e) => {
                State.autoRotate = e.target.checked;
            });

            // Buttons
            document.getElementById('btn-generate').addEventListener('click', createTextParticles);
            
            document.getElementById('btn-scatter').addEventListener('click', () => {
                if (!particles) return;
                const positions = geometry.attributes.position.array;
                for (let i = 0; i < positions.length; i += 3) {
                    positions[i] += (Math.random() - 0.5) * 100;
                    positions[i+1] += (Math.random() - 0.5) * 100;
                    positions[i+2] += (Math.random() - 0.5) * 100;
                }
                geometry.attributes.position.needsUpdate = true;
            });

            document.getElementById('btn-record').addEventListener('click', handleRecording);

            // Toggle Hide/Show UI
            const toggleBtn = document.getElementById('toggle-ui');
            const toggleIcon = document.getElementById('toggle-icon');
            const panel = document.getElementById('ui-panel');
            let isPanelVisible = true;

            toggleBtn.addEventListener('click', () => {
                isPanelVisible = !isPanelVisible;
                
                if (isPanelVisible) {
                    panel.classList.remove('hidden-state');
                    toggleIcon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>`;
                    toggleIcon.classList.remove('rotate-180');
                } else {
                    panel.classList.add('hidden-state');
                    toggleIcon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>`;
                    toggleIcon.classList.add('rotate-180');
                }
            });

            // Mouse leave cleanup
            document.body.addEventListener('mouseleave', () => mouse.set(-9999, -9999));
            document.body.addEventListener('touchend', () => mouse.set(-9999, -9999));
        }

        function onWindowResize() {
            // Main Camera Update
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            
            // HUD Camera Update
            hudCamera.left = -window.innerWidth / 2;
            hudCamera.right = window.innerWidth / 2;
            hudCamera.top = window.innerHeight / 2;
            hudCamera.bottom = -window.innerHeight / 2;
            hudCamera.updateProjectionMatrix();
            
            updateWatermarkPosition();
            
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // --- STREAMING_CHUNK: Render Loop & Multi-Scene Compositing ---
        function animate() {
            requestAnimationFrame(animate);
            
            if (State.autoRotate) {
                scene.rotation.y += 0.005;
            } else {
                // Ease back to center if turned off
                scene.rotation.y += (0 - scene.rotation.y) * 0.05;
            }

            controls.update();
            updatePhysics();
            
            // 1. Clear color & depth
            renderer.clear();
            
            // 2. Render Main 3D Particles
            renderer.render(scene, camera);
            
            // 3. Clear DEPTH so the HUD renders ON TOP of everything
            renderer.clearDepth();
            
            // 4. Render the Watermark HUD (Will be captured by MediaRecorder)
            renderer.render(hudScene, hudCamera);
        }

        init();
    </script>
</body>
</html>
